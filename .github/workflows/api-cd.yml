name: Build and Push API Image

on:
  push:
    branches:
      - 'staging'
      - 'main'

env:
  APP_NAME: circulation-supply-api
  CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}

jobs:
  build-and-update:
    name: Build and Push Image, Update Helm Chart
    runs-on: ubuntu-latest

    environment: ${{ (github.ref_name == 'main') && 'production' || 'staging' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME=gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.APP_NAME }}:${{ github.sha }}
          docker build \
            --push \
            --tag $IMAGE_NAME \
            -f ./dockerfiles/api.Dockerfile \
            .
        env:
          IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.APP_NAME }}:${{ github.sha }}

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: storyprotocol/story-helm
          ref: main
          token: ${{ secrets.HELM_REPO_TOKEN }}
      
      - name: Update Image Tag
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq -i '.image.tag = "${{ github.sha }}"' 'circulation-supply/${{ env.APP_NAME }}/${{ env.CLUSTER_NAME }}.yaml'

      - name: Push Changed Image Tag
        run: |
          git config --global user.name ${{ github.actor }}
          git config --global user.email ${{ github.actor }}@users.noreply.github.com
          git fetch && git checkout main

          if [ -z "$(git status --porcelain)" ]
          then
            echo "Nothing to commit, working directory clean"
          else
            git commit -am "${{ env.APP_NAME }}: Update image tag to ${{ github.sha }}" && git push
          fi
